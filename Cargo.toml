[package]
name = "localsm"
version = "0.1.0"
edition = "2024"

[lib]
name = "localsm"
path = "src/localsm.rs"
crate-type = ["lib"]

[dependencies]
chrono = "0.4.45"
postcard = { version = "1.1.3", features = ["alloc"] }
rapidhash = "4.5.1"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
spdlog-rs = "0.5.3"
toml = "1.1.6"
