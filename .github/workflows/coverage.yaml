name: Rust Test

on:
  push:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - name: Run unit and integration tests
        run: |
              cargo install cargo-llvm-cov
              mkdir coverage
              cargo llvm-cov --json --output-path coverage/coverage-summary.json
              echo "========================================="
              echo "LINE COVERAGE: $(jq .data[0].totals.lines.percent coverage/coverage-summary.json)"
              echo "========================================="
              echo "$(jq .data[0].totals.lines.percent coverage/coverage-summary.json)" >> "$GITHUB_OUTPUT"
      - name: Generate coverage badge
        uses: ozankasikci/rust-test-coverage-badge@v1
        with:
          coverage: ${{ steps.coverage.outputs.percentage }}
          output: assets/coverage.svg
          commit: true