name: Rust Test

on:
  push:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: cargo-llvm-cov
      - name: Run unit and integration tests
        run: cargo llvm-cov
