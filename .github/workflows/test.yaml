name: Rust Test

on:
  push:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - name: Run unit and integration tests
        run: |
              cargo install cargo-llvm-cov
              cargo llvm-cov
